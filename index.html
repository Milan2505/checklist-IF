<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1117">
<meta name="description" content="Checklist de vol Infinite Flight — préparation SimBrief, MCDU, départ, croisière, arrivée et après-vol.">
<title>CHECKLIST VOL — Infinite Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1117;
  --panel:#101A21;
  --panel-2:#152229;
  --line:#1E2E37;
  --line-soft:#182630;
  --txt:#E7EEF2;
  --muted:#7E939F;
  --green:#33D67A;    /* normal / fait */
  --amber:#FFB01F;    /* limite, seuil, piege */
  --magenta:#E86BD4;  /* calcule */
  --cyan:#4FD8F5;     /* saisi par le pilote */
  --display:"Barlow Condensed", "Oswald", Impact, sans-serif;
  --body:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--body);
  font-size:15px;line-height:1.5;
  padding-bottom:96px;
  background-image:radial-gradient(120% 60% at 50% -10%, #14242e 0%, var(--bg) 60%);
  background-attachment:fixed;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* ---------- entete ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,rgba(10,17,23,.98) 70%,rgba(10,17,23,.86));
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hdr-top{display:flex;align-items:baseline;gap:10px;padding:12px 0 8px}
.brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.13em;text-transform:uppercase}
.rev{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rev-chip{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;
  letter-spacing:.06em;border:1px solid;white-space:nowrap}
.rev-chip.doc{color:var(--amber);border-color:#4a3a12;background:#221a08}
.rev-chip.sheet{color:var(--cyan);border-color:#1c4453;background:#071a20}
.rev-chip.vide{color:var(--muted);border-color:var(--line);background:transparent}
.rev-note{font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:0}
.hdr-top .spacer{flex:1}
.count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.count b{color:var(--green);font-weight:600}

/* ---------- signature : profil de vol ---------- */
.profile{position:relative;padding:2px 0 10px}
.profile svg{display:block;width:100%;height:64px;overflow:visible}
.pf-track{fill:none;stroke:var(--line);stroke-width:1.5}
.pf-done{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(51,214,122,.45));transition:stroke-dasharray .45s ease}
.node{cursor:pointer}
.node circle{transition:all .25s ease}
.node .ring{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.node.done .ring{stroke:var(--green);fill:#0d2418}
.node.active .ring{stroke:var(--amber);fill:#241a05;r:7}
.node .num{font-family:var(--mono);font-size:8px;fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.node.done .num{fill:var(--green)}
.node.active .num{fill:var(--amber);font-weight:700}
.pf-label{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:var(--amber);text-anchor:middle}

/* ---------- barres ---------- */
.bar{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);width:0;transition:width .3s ease}

/* ---------- boutons outils ---------- */
.tools{display:flex;gap:8px;padding:0 0 12px;flex-wrap:wrap}
.btn{
  font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  background:var(--panel);color:var(--txt);border:1px solid var(--line);
  padding:9px 13px;border-radius:var(--r);cursor:pointer;min-height:40px;
}
.btn:hover{border-color:#2d4351}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:#7a2b2b;color:#ff8b8b}

/* ---------- panneau valeurs du vol ---------- */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:0 0 14px;overflow:hidden}
.sheet h2{
  font-family:var(--display);font-size:14px;letter-spacing:.16em;text-transform:uppercase;
  margin:0;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;padding:12px;align-items:stretch}
/* Les libelles du formulaire n'ont pas tous la meme longueur : « Passagers »
   tient sur une ligne, « Indicatif d'appel ATC » sur deux. Le champ suivait le
   bas du libelle, donc deux cases voisines ne demarraient pas a la meme
   hauteur. La case est desormais poussee au bas de sa rangee : les libelles
   s'alignent par le haut, les champs par le bas, quelle que soit la casse. */
.fld{display:flex;flex-direction:column;min-width:0}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.fld input{
  width:100%;background:#0A1319;border:1px solid var(--line);color:var(--cyan);
  font-family:var(--mono);font-size:14px;padding:8px 9px;border-radius:7px;min-height:38px;
  margin-top:auto;
}
.fld input:focus{outline:none;border-color:var(--cyan)}
/* groupes de saisie du panneau */
.grp{grid-column:1/-1;font-family:var(--display);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--amber);border-bottom:1px solid var(--line);
  padding:9px 0 5px;margin-top:2px}
.grp:first-child{margin-top:0;padding-top:0}
.fld.wide{grid-column:span 2}
/* valeur reprise du briefing, pas encore confirmee par le pilote */
.fld.auto input{border-style:dashed;border-color:#4a6b7a}
/* marqueur court : les libelles du formulaire sont longs, " ⇠ briefing" en
   toutes lettres faisait passer la moitie du panneau sur deux lignes. Le titre
   de l'input porte la phrase complete. Espace INSECABLE : sinon la fleche part
   seule sur la ligne suivante et ajoute une ligne vide au libelle. */
.fld.auto label::after{content:"\00a0⇠";color:#5f7f8d;letter-spacing:0}
/* attendue au cartouche mais non resolue : distinct d'une case simplement vide */
.fld.unresolved input{border-color:#6a3a12;background:#1a1005}
.fld.unresolved label{color:var(--amber)}
.fld.unresolved label::after{content:" ⚠ non résolu";color:var(--amber);letter-spacing:0}
.hint{padding:0 12px 12px;font-size:12px;color:var(--muted)}
/* bandeau d'anomalie du cartouche */
.alert{border:1px solid #6a4212;background:#241605;color:#f0d0a4;border-radius:var(--r);
  padding:11px 13px;margin:0 0 12px;font-size:13px;line-height:1.5}
.alert strong{color:var(--amber)}
.alert-note{display:block;margin-top:6px;color:#b08a5e;font-size:12px}

/* ---------- phases ---------- */
.phase{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:10px;overflow:hidden}
.phase.active{border-color:#2b4250}
.ph-head{
  display:flex;align-items:center;gap:11px;width:100%;
  background:none;border:0;color:inherit;text-align:left;
  padding:13px 14px;cursor:pointer;min-height:56px;
}
.ph-head:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.ph-idx{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;flex:none}
.phase.complete .ph-idx{color:var(--green)}
.ph-title{font-family:var(--display);font-size:17px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;flex:1;line-height:1.15}
.ph-sub{display:block;margin-top:3px;font-family:var(--body);font-size:11.5px;letter-spacing:0;
  text-transform:none;font-weight:400;color:var(--muted);line-height:1.35}
.phase.complete .ph-title{color:var(--green)}
.ph-count{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.chev{width:9px;height:9px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
  transform:rotate(45deg);margin-left:2px;flex:none;transition:transform .2s}
.phase.open .chev{transform:rotate(-135deg)}
.ph-bar{padding:0 14px 11px}
.ph-body{display:none;padding:2px 0 6px;border-top:1px solid var(--line-soft)}
.phase.open .ph-body{display:block}

/* ---------- items ---------- */
.item{
  display:flex;gap:12px;align-items:flex-start;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line-soft);color:inherit;text-align:left;
  padding:13px 14px;cursor:pointer;min-height:52px;font-family:var(--body);font-size:15px;
}
.item:last-child{border-bottom:0}
.item:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
.box{
  width:21px;height:21px;flex:none;margin-top:1px;border-radius:5px;
  border:1.5px solid #3b5060;position:relative;transition:all .18s;
}
.item.warn .box{border-color:#6a5316}
.item.done .box{background:var(--green);border-color:var(--green)}
.item.done .box::after{
  content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
  border:solid #06210f;border-width:0 2.2px 2.2px 0;transform:rotate(42deg);
}
.it-txt{flex:1;min-width:0}
.it-t{display:block}
.item.warn .it-t::before{content:"⚠ ";color:var(--amber)}
.item.done .it-t{color:var(--muted);text-decoration:line-through;text-decoration-color:#2c4a39}
.it-d{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.item.done .it-d{opacity:.5}
.val{font-family:var(--mono);color:var(--cyan);font-size:13.5px}
.val.empty{color:#5d7280}
.ref{
  flex:none;font-family:var(--mono);font-size:10.5px;color:var(--magenta);
  border:1px solid #43244a;background:#1c1022;border-radius:6px;padding:3px 6px;margin-top:1px;
  cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1.25;font-weight:500;
}
.ref:hover{border-color:var(--magenta)}
.ref:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
/* dossier charge : la pastille dit si sa section est dans le fichier */
.ref.ok{border-color:var(--magenta)}
.ref.miss{color:#4e5c66;border-color:#212d35;background:#0d151a}
.ref.miss:hover{border-color:#2f3f4a}

/* ---------- lecteur de section ---------- */
.drawer{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(4,8,11,.72);backdrop-filter:blur(3px);
}
.drawer.open{display:block}
.dr-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:84vh;overflow:auto;overscroll-behavior:contain;
  background:var(--panel-2);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{position:sticky;top:0;background:var(--panel-2);display:flex;align-items:center;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.dr-head h3{margin:0;flex:1;font-family:var(--display);font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.md{font-size:14.5px;line-height:1.62;padding-top:12px}
.md h1,.md h2,.md h3{font-family:var(--display);letter-spacing:.09em;text-transform:uppercase;margin:20px 0 8px;font-size:16px;color:var(--txt)}
.md p{margin:9px 0}
.md ul,.md ol{margin:9px 0;padding-left:19px}
.md li{margin:5px 0}
.md code{font-family:var(--mono);font-size:13px;background:#0a141a;border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--cyan)}
.md pre{font-family:var(--mono);font-size:12.5px;background:#091217;border:1px solid var(--line);padding:11px;border-radius:8px;overflow:auto;white-space:pre;color:#a9c3d0}
.md table{width:100%;border-collapse:collapse;margin:11px 0;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.md th{background:#0d181e;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.md .w{color:var(--amber)}
.md strong{color:#fff}
.empty-state{padding:26px 0 10px;color:var(--muted);font-size:14px}

/* ---------- pied ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,rgba(10,17,23,.5),rgba(10,17,23,.97) 40%);
  border-top:1px solid var(--line);
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
}
.foot-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .lbl{font-family:var(--display);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);flex:none}
.foot .bar{flex:1}
.foot .pct{font-family:var(--mono);font-size:13px;color:var(--green);flex:none;min-width:38px;text-align:right}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:70;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt);
  padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s
}
.toast.show{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:2px 2px 16px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hdr-top">
      <div class="brand">Checklist vol</div>
      <div class="rev" id="revTag"><span class="rev-chip vide">aucun briefing</span></div>
      <div class="spacer"></div>
      <div class="count" id="hdrCount"><b>0</b>/0</div>
    </div>
    <div class="profile">
      <svg id="pf" viewBox="0 0 1000 64" preserveAspectRatio="none" aria-hidden="true">
        <path id="pfPath" class="pf-track" d="M 14 56 L 120 56 C 210 56 235 12 340 12 L 660 12 C 770 12 800 50 880 56 L 986 56"/>
        <path id="pfDone" class="pf-done" d="M 14 56 L 120 56 C 210 56 235 12 340 12 L 660 12 C 770 12 800 50 880 56 L 986 56"/>
        <g id="pfNodes"></g>
      </svg>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <button type="button" class="btn" id="btnLoad">Charger le briefing</button>
    <button type="button" class="btn ghost" id="btnValues" aria-expanded="false" aria-controls="valuesSheet">Valeurs du vol</button>
    <button type="button" class="btn ghost" id="btnOpen" aria-pressed="false">Tout déplier</button>
    <button type="button" class="btn ghost danger" id="btnReset">Nouveau vol</button>
    <input type="file" id="file" accept=".md,.markdown,.txt" hidden>
  </div>

  <div class="alert" id="alert" role="alert" hidden></div>

  <section class="sheet" id="valuesSheet" hidden>
    <h2>Valeurs du vol</h2>
    <div class="grid" id="valGrid"></div>
    <p class="hint">Ces valeurs s'affichent dans les lignes de la checklist là où elles servent. Elles viennent de SimBrief, de l'OFP et du MCDU — tapez-les une fois, elles suivent tout le vol.</p>
  </section>

  <div id="phases"></div>

  <div class="legend">
    <span><i style="background:var(--green)"></i>fait</span>
    <span><i style="background:var(--amber)"></i>limite ou piège</span>
    <span><i style="background:var(--magenta)"></i>renvoi au dossier</span>
    <span><i style="background:var(--cyan)"></i>valeur saisie</span>
  </div>
</main>

<div class="foot">
  <div class="foot-in">
    <span class="lbl" id="footPhase">Vol</span>
    <div class="bar" role="progressbar" aria-label="Avancement du vol" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="footBar"></span></div>
    <span class="pct" id="footPct">0%</span>
  </div>
</div>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drTitle" aria-hidden="true">
  <div class="dr-panel">
    <div class="dr-head">
      <h3 id="drTitle">Section</h3>
      <button type="button" class="btn ghost" id="drClose">Fermer</button>
    </div>
    <div class="md" id="drBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* ============================================================
   CONTENU — tire du BRIEFING PRE-VOL INFINITE FLIGHT, REV 19
   t : ligne de checklist · d : detail · r : renvoi · w : point de vigilance
   {{cle}} : valeur du vol, saisie dans le panneau Valeurs
============================================================ */
/* [cle, libelle, groupe] — REV 19 : le panneau suit d'abord l'ORDRE DE LA PAGE
   SimBrief (§0.2 Vol → §0.3 Avion → §0.1 Plus d'options → §0.4 Sélections →
   §0.5 Facultatives → §0.6 Carburant → §0.7 Texte → §0.8 Itinéraire →
   §0.9 Alternatifs). Ce qui se tape dans le formulaire passe donc en premier,
   dans l'ordre ou on le tape ; les cartouches du §A.4 viennent derriere.
   Les libelles sont ceux du formulaire francais, pas des abreviations. */
const FIELDS = [
  /* ---------- ce qui se tape dans SimBrief, dans l'ordre de la page ---------- */
  ['airline','Compagnie aérienne','1 · Informations sur le vol'],
  ['fltnum','Numéro du vol','1 · Informations sur le vol'],
  ['route','Partir → Arriver','1 · Informations sur le vol'],
  ['degag','Alterner','1 · Informations sur le vol'],
  ['eobt','Heure de départ (EOBT)','1 · Informations sur le vol'],

  ['type','Type d\'aéronef','2 · Informations sur l\'avion'],
  ['callsign','Indicatif d\'appel ATC','2 · Informations sur l\'avion'],

  /* §0.1 — les neuf de « Plus d'options ». Les quatre chaines d'equipement
     (SDFGHRWY, LB1, PBN, Article 18) sont invariantes : elles sont ecrites en
     clair dans la ligne de checklist, pas ici. */
  ['fuelfactor','Facteur carburant','3 · Plus d\'options'],
  ['immat','Inscription','3 · Plus d\'options'],
  ['finnum','Numéro Fin','3 · Plus d\'options'],
  ['selcal','SELCAL','3 · Plus d\'options'],
  ['modes','Code Mode-S','3 · Plus d\'options'],

  ['airac','Cycle AIRAC','4 · Sélections'],
  ['taxitime','Taxi Sortie / Entrée','4 · Sélections'],

  ['blocktime','Bloc horaire prévu','5 · Entrées facultatives'],
  ['fl','Altitude (Pieds) — FL','5 · Entrées facultatives'],
  ['pax','Passagers','5 · Entrées facultatives'],
  ['fret','Fret kg','5 · Entrées facultatives'],
  ['payload','Charge utile kg','5 · Entrées facultatives'],
  ['zfw','Poids zéro carburant kg','5 · Entrées facultatives'],

  ['extra','EXTRA kg','6 · Planification du carburant'],

  ['pilotid','Identifiant du pilote','7 · Entrées de texte'],

  ['rte','Selected Route','8 · Itinéraire'],

  ['degcap','Cap dégagement','9 · Aéroports alternatifs'],
  ['degdist','Distance dégagement NM','9 · Aéroports alternatifs'],

  /* ---------- cartouches du §A.4 : lus par la page, pas tapes dans le formulaire ---------- */
  /* Les deux pistes restent en AUTO cote SimBrief (§0.5) : elles ne se tapent
     pas, elles se comparent — leur place est au cartouche ②. */
  ['piste','Piste départ','Cartouche ② · pistes'],
  ['capdep','Cap départ','Cartouche ② · pistes'],
  ['arrpiste','Piste arrivée','Cartouche ② · pistes'],

  ['v1','V1','Cartouche ③ · vitesses et trajectoire'],
  ['vr','VR','Cartouche ③ · vitesses et trajectoire'],
  ['v2','V2','Cartouche ③ · vitesses et trajectoire'],
  ['flex','Flex','Cartouche ③ · vitesses et trajectoire'],
  ['volets','Volets','Cartouche ③ · vitesses et trajectoire'],
  ['thrred','Réduction ft','Cartouche ③ · vitesses et trajectoire'],
  ['accel','Accélération ft','Cartouche ③ · vitesses et trajectoire'],
  ['trans','Transition ft','Cartouche ③ · vitesses et trajectoire'],
  ['ils','ILS','Cartouche ③ · vitesses et trajectoire'],
  ['da','DA ft','Cartouche ③ · vitesses et trajectoire'],
  ['vref','Vref kt','Cartouche ③ · vitesses et trajectoire'],
  ['vapp','Vapp kt','Cartouche ③ · vitesses et trajectoire'],
  ['inbound','Inbound NM','Cartouche ③ · vitesses et trajectoire'],
  ['inbwpt','Point inbound','Cartouche ③ · vitesses et trajectoire'],

  ['bloc','BLOC kg','Cartouche ④ · carburant'],
  ['bingo','BINGO kg','Cartouche ④ · carburant'],
  ['mindiv','MIN DIV kg','Cartouche ④ · carburant'],

  ['oew','Masse à vide IF kg','Cartouche ⑤ · masses'],
  ['trip','Trip kg','Cartouche ⑤ · masses'],
  ['tow','TOW t','Cartouche ⑤ · masses'],
  ['lw','LW t','Cartouche ⑤ · masses'],

  /* Repères non lus (§A.4) : hors registre, saisis a la main, jamais extraits. */

   ETAT ET STOCKAGE
   Progression et valeurs dans une cle, briefing dans une autre :
   un dossier volumineux ne peut plus faire perdre le vol en cours.
   Repli automatique : hote -> localStorage -> memoire de session.
============================================================ */
const KEY = 'if-checklist-v1';
const DOC_KEY = 'if-checklist-doc-v1';
const SHEET_KEY = 'if-checklist-sheet-v1';

let state = { done:{}, values:{}, auto:{}, open:0,
              doc:null, rev:null,          /* dossier de reference */
              sheet:null, sheetRev:null, sheetCallsign:null }; /* feuille du vol */
let allOpen = false, memoryOnly = false, docDirty = false, sheetDirty = false;

const store = (function(){
  const host = (window.storage && typeof window.storage.get === 'function') ? window.storage : null;
  let useHost = !!host;
  function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
  return {
    async get(k){
      if(useHost){
        try{ const r = await host.get(k); return (r && r.value != null) ? r.value : null; }
        catch(e){ useHost = false; }
      }
      const s = ls(); return s ? s.getItem(k) : null;
    },
    async set(k,v){
      if(useHost){
        try{ await host.set(k,v); return; }
        catch(e){ useHost = false; }
      }
      const s = ls();
      if(!s) throw new Error('stockage indisponible');
      s.setItem(k,v);
    },
    async remove(k){
      if(useHost){ try{ await host.set(k,''); return; }catch(e){ useHost = false; } }
      const s = ls(); if(s) s.removeItem(k);
    }
  };
})();

/* on n'adopte que ce qui a le bon type : un stockage abime ne casse pas la page */
function adopt(o){
  if(!o || typeof o !== 'object') return;
  if(o.done   && typeof o.done   === 'object') state.done   = Object.assign({}, o.done);
  if(o.values && typeof o.values === 'object') state.values = Object.assign({}, o.values);
  if(o.auto   && typeof o.auto   === 'object') state.auto   = Object.assign({}, o.auto);
  if(typeof o.open === 'number') state.open = o.open;
  if(typeof o.rev  === 'string') state.rev  = o.rev;
  if(typeof o.sheetRev === 'string') state.sheetRev = o.sheetRev;
  if(typeof o.sheetCallsign === 'string') state.sheetCallsign = o.sheetCallsign;
  /* ancienne version : le briefing vivait dans la meme cle */
  if(typeof o.doc === 'string' && o.doc){ state.doc = o.doc; docDirty = true; }
  if(typeof o.sheet === 'string' && o.sheet){ state.sheet = o.sheet; sheetDirty = true; }
}

async function load(){
  try{
    const raw = await store.get(KEY);
    if(raw) adopt(JSON.parse(raw));
  }catch(e){ /* premiere ouverture, ou stockage indisponible */ }
  try{
    const doc = await store.get(DOC_KEY);
    if(doc) state.doc = doc;
    const sheet = await store.get(SHEET_KEY);
    if(sheet) state.sheet = sheet;
  }catch(e){ /* le bouton Charger reste la */ }
}

let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 250); }

async function flush(){
  clearTimeout(saveTimer); saveTimer = null;
  try{
    await store.set(KEY, JSON.stringify({
      done:state.done, values:state.values, auto:state.auto, open:state.open,
      rev:state.rev, sheetRev:state.sheetRev, sheetCallsign:state.sheetCallsign
    }));
  }catch(e){
    if(!memoryOnly){ memoryOnly = true; toast("Progression gardée pour cette session seulement"); }
    return;
  }
  if(docDirty){
    docDirty = false;
    try{
      if(state.doc) await store.set(DOC_KEY, state.doc);
      else await store.remove(DOC_KEY);
    }catch(e){
      /* dossier trop lourd pour le stockage : on le garde en memoire,
         la progression, elle, vient d'etre ecrite */
      try{ await store.remove(DOC_KEY); }catch(e2){}
      toast("Dossier gardé pour cette session seulement");
    }
  }
  if(sheetDirty){
    sheetDirty = false;
    try{
      if(state.sheet) await store.set(SHEET_KEY, state.sheet);
      else await store.remove(SHEET_KEY);
    }catch(e){
      try{ await store.remove(SHEET_KEY); }catch(e2){}
      toast("Feuille gardée pour cette session seulement");
    }
  }
}

/* une case cochee juste avant de fermer l'onglet ne se perd pas */
function flushNow(){ if(saveTimer) flush(); }
window.addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') flushNow(); });

/* ============================================================
   RENDU
============================================================ */
function esc(s){
  return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* {{cle}} devient une pastille reperable, mise a jour sans reconstruire la liste */
const PLACEHOLDER = /\{\{(\w+)\}\}/g;
function valSpan(k){
  const v = (state.values[k]||'').trim();
  return '<span class="val'+(v?'':' empty')+'" data-k="'+esc(k)+'">'+esc(v||'___')+'</span>';
}
function inject(txt){
  let out = '', last = 0, m;
  PLACEHOLDER.lastIndex = 0;
  while((m = PLACEHOLDER.exec(txt))){
    out += esc(txt.slice(last, m.index)) + valSpan(m[1]);
    last = PLACEHOLDER.lastIndex;
  }
  return out + esc(txt.slice(last));
}
function refreshValues(){
  el.phases.querySelectorAll('.val[data-k]').forEach(node=>{
    const v = (state.values[node.dataset.k]||'').trim();
    node.textContent = v || '___';
    node.classList.toggle('empty', !v);
  });
}

const secs = [];   /* une section par phase, dans l'ordre */

function render(){
  const frag = document.createDocumentFragment();
  secs.length = 0;

  PHASES.forEach((ph,pi)=>{
    const sec = document.createElement('section');
    sec.className = 'phase';
    sec.dataset.p = pi;

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'ph-head';
    head.id = 'ph-head-'+pi;
    head.setAttribute('aria-controls', 'ph-body-'+pi);
    head.innerHTML =
      '<span class="ph-idx">'+String(pi+1).padStart(2,'0')+'</span>'+
      '<span class="ph-title">'+esc(ph.n)+
        (ph.s ? '<span class="ph-sub">'+esc(ph.s)+'</span>' : '')+
      '</span>'+
      '<span class="ph-count"></span>'+
      '<span class="chev" aria-hidden="true"></span>';
    sec.appendChild(head);

    const barw = document.createElement('div');
    barw.className = 'ph-bar';
    barw.innerHTML = '<div class="bar"><span></span></div>';
    sec.appendChild(barw);

    const body = document.createElement('div');
    body.className = 'ph-body';
    body.id = 'ph-body-'+pi;
    body.setAttribute('role','group');
    body.setAttribute('aria-labelledby','ph-head-'+pi);

    ph.items.forEach((it,ii)=>{
      const on = !!state.done[id(pi,ii)];
      const row = document.createElement('div');
      row.className = 'item' + (on?' done':'') + (it.w?' warn':'');
      row.dataset.p = pi; row.dataset.i = ii;
      row.setAttribute('role','checkbox');
      row.setAttribute('aria-checked', on?'true':'false');
      row.tabIndex = 0;
      row.innerHTML =
        '<span class="box" aria-hidden="true"></span>'+
        '<span class="it-txt"><span class="it-t">'+inject(it.t)+'</span>'+
          (it.d ? '<span class="it-d">'+inject(it.d)+'</span>' : '')+
        '</span>'+
        (it.r ? '<button type="button" class="ref" data-ref="'+esc(it.r)+'"'+
                ' aria-label="Ouvrir la section '+esc(it.r)+' du briefing">§'+esc(it.r)+'</button>' : '');
      body.appendChild(row);
    });

    sec.appendChild(body);
    frag.appendChild(sec);
    secs.push(sec);
  });

  el.phases.innerHTML = '';
  el.phases.appendChild(frag);
  applyOpen();
  PHASES.forEach((_,pi)=> paintPhase(pi));
  paintProgress();
  markRefs();
}

/* un seul ecouteur pour toute la liste : rien a rebrancher a chaque redessin */
el.phases.addEventListener('click', e=>{
  const ref = e.target.closest('.ref');
  if(ref){ openRef(ref.dataset.ref); return; }
  const head = e.target.closest('.ph-head');
  if(head){ onHead(+head.parentElement.dataset.p); return; }
  const row = e.target.closest('.item');
  if(row) toggleRow(row);
});
el.phases.addEventListener('keydown', e=>{
  if(e.key !== ' ' && e.key !== 'Enter') return;
  const row = e.target.classList && e.target.classList.contains('item') ? e.target : null;
  if(row){ e.preventDefault(); toggleRow(row); }
});

/* cocher ne reconstruit plus la page : defilement, focus et sections
   depliees restent ou le pilote les a laisses */
function toggleRow(row){
  const pi = +row.dataset.p, key = id(pi, +row.dataset.i);
  if(state.done[key]) delete state.done[key]; else state.done[key] = true;
  const on = !!state.done[key];
  row.classList.toggle('done', on);
  row.setAttribute('aria-checked', on?'true':'false');
  paintPhase(pi);
  paintProgress();
  save();
}

function doneCount(pi){
  let d = 0;
  PHASES[pi].items.forEach((_,ii)=>{ if(state.done[id(pi,ii)]) d++; });
  return d;
}

function paintPhase(pi){
  const sec = secs[pi]; if(!sec) return;
  const total = PHASES[pi].items.length, done = doneCount(pi);
  sec.querySelector('.ph-count').textContent = done+'/'+total;
  sec.querySelector('.ph-bar .bar span').style.width = (total ? done/total*100 : 0)+'%';
  sec.classList.toggle('complete', total > 0 && done === total);
}

function applyOpen(){
  secs.forEach((sec,pi)=>{
    const open = allOpen || state.open === pi;
    sec.classList.toggle('open', open);
    sec.classList.toggle('active', state.open === pi);
    sec.querySelector('.ph-head').setAttribute('aria-expanded', open ? 'true':'false');
  });
}

function onHead(pi){
  if(allOpen){                       /* tout est deplie : on ne referme que celle-ci */
    const sec = secs[pi];
    const open = !sec.classList.contains('open');
    sec.classList.toggle('open', open);
    sec.querySelector('.ph-head').setAttribute('aria-expanded', open ? 'true':'false');
    return;
  }
  state.open = (state.open === pi ? -1 : pi);
  applyOpen();
  paintProgress();
  save();
  if(state.open === pi) scrollPhase(pi);
}

function openPhase(pi){
  allOpen = false; syncOpenBtn();
  state.open = pi;
  applyOpen(); paintProgress(); save(); scrollPhase(pi);
}

function scrollPhase(pi){
  if(pi < 0) return;
  requestAnimationFrame(()=>{
    const sec = secs[pi]; if(!sec) return;
    const marge = (el.header ? el.header.offsetHeight : 130) + 12;
    const y = sec.getBoundingClientRect().top + window.scrollY - marge;
    window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
  });
}

/* --- profil de vol + compteurs --- */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function buildNodes(){
  const L = el.pfPath.getTotalLength(), n = PHASES.length;
  el.pfNodes.textContent = '';
  PHASES.forEach((ph,i)=>{
    const p = el.pfPath.getPointAtLength(n > 1 ? L*(i/(n-1)) : L/2);
    const g = svgEl('g', {'class':'node', 'data-p':i});
    g.appendChild(svgEl('circle', {'class':'ring', cx:p.x, cy:p.y, r:6}));
    const t = svgEl('text', {'class':'num', x:p.x, y:p.y+0.5});
    t.textContent = i+1;
    g.appendChild(t);
    g.addEventListener('click', ()=> openPhase(i));
    el.pfNodes.appendChild(g);
  });
  el.pfNodes.appendChild(svgEl('text', {'class':'pf-label', id:'pfLabel', x:500, y:34}));
}

function paintProgress(){
  let all = 0, ok = 0, lastComplete = -1;
  PHASES.forEach((ph,pi)=>{
    const d = doneCount(pi);
    all += ph.items.length; ok += d;
    if(d === ph.items.length) lastComplete = pi;
  });
  const pct = all ? ok/all : 0, pctInt = Math.round(pct*100);

  el.hdrCount.innerHTML = '<b>'+ok+'</b>/'+all;
  el.footBar.style.width = (pct*100)+'%';
  el.footPct.textContent = pctInt+'%';
  if(el.footWrap) el.footWrap.setAttribute('aria-valuenow', pctInt);

  const cur = state.open >= 0 ? state.open : Math.min(lastComplete+1, PHASES.length-1);
  el.footPhase.textContent = PHASES[cur] ? PHASES[cur].n : 'Vol';

  const L = el.pfPath.getTotalLength();
  el.pfDone.style.strokeDasharray = (L*pct)+' '+L;
  el.pfNodes.querySelectorAll('.node').forEach((g,i)=>{
    g.classList.toggle('done', doneCount(i) === PHASES[i].items.length);
    g.classList.toggle('active', i === cur);
  });
  const lbl = document.getElementById('pfLabel');
  if(lbl) lbl.textContent = PHASES[cur] ? PHASES[cur].n : '';
}

/* champs strictement chiffres : clavier numerique sur tablette */
const NUM = ['v1','vr','v2','flex','thrred','accel','bloc','trip','bingo','mindiv',
             'da','lw','vref','vapp','inbound','degcap','degdist','capdep','tow','oew',
             'fltnum','pilotid','airac','pax','fret','payload','zfw','trans','extra',
             'altinit'];

/* champs a valeur longue : deux colonnes */
const WIDE = ['eobt','rte','route'];

function buildValues(){
  const frag = document.createDocumentFragment();
  let groupe = null;
  FIELDS.forEach(([k,label,g])=>{
    if(g && g !== groupe){
      groupe = g;
      const h = document.createElement('div');
      h.className = 'grp';
      h.textContent = g;
      frag.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'fld' + (WIDE.indexOf(k) >= 0 ? ' wide' : '');
    d.innerHTML =
      '<label for="f-'+k+'">'+esc(label)+'</label>'+
      '<input id="f-'+k+'" autocomplete="off" spellcheck="false" enterkeyhint="done"'+
      (NUM.indexOf(k) >= 0 ? ' inputmode="decimal"' : '')+'>';
    const inp = d.querySelector('input');
    inp.value = state.values[k] || '';
    if(state.auto[k]){                     /* reprise du briefing, non confirmee */
      d.classList.add('auto');
      inp.title = 'Valeur reprise du briefing — à confirmer sur l\'OFP';
    }
    /* saisie : on rafraichit les pastilles, on ne reconstruit pas la checklist */
    inp.addEventListener('input', ()=>{
      state.values[k] = inp.value;
      d.classList.remove('auto');          /* corrigee a la main : plus une reprise */
      delete state.auto[k];
      inp.removeAttribute('title');
      refreshValues();
      save();
    });
    frag.appendChild(d);
  });
  el.valGrid.appendChild(frag);
}

/* ============================================================
   CHARGEMENT DU BRIEFING + LECTURE DES SECTIONS
============================================================ */
/* Deux documents, deux roles, jamais confondus :
   - le DOSSIER porte la methode et les sections § ; son §0 est un gabarit,
     ses colonnes decrivent quoi taper et ne contiennent aucune valeur ;
   - la FEUILLE DU VOL porte les valeurs du jour.
   Un fichier qui resout au moins dix renvois est un dossier, pas une feuille. */
let docIdx = null, sheetIdx = null;

function buildIndex(txt){
  const lines = txt.split('\n'), heads = [];
  let inCode = false;
  lines.forEach((l,i)=>{
    if(/^```/.test(l)){ inCode = !inCode; return; }
    if(inCode) return;                        /* un # dans un bloc de code n'est pas un titre */
    const m = l.match(/^(#{1,4})\s+(.*)$/);
    /* REV 19 titre ses sous-sections « ### §0.5 · … » : le § fait partie du
       titre, pas du numero. On l'enleve a l'indexation, sinon le renvoi 0.5
       ne retrouve jamais sa section. */
    if(m) heads.push({lvl:m[1].length, txt:m[2].replace(/[`*]/g,'').replace(/^§\s*/,'').trim(), i:i});
  });
  return { lines:lines, heads:heads };
}
/* l'entete annonce ce qui est charge : dossier, feuille, ou les deux */
/* Deux pastilles distinctes : le dossier ne bouge qu'a un changement de
   protocole, la feuille se refait a chaque vol. Voir la paire d'un coup
   d'oeil evite de voler sur la feuille d'hier. */
function badgeRev(){
  const out = [];
  if(state.rev) out.push('<span class="rev-chip doc" title="Dossier de référence">'+esc(state.rev)+'</span>');
  if(state.sheetRev){
    const cs = (state.sheetCallsign||'').trim();
    out.push('<span class="rev-chip sheet" title="Feuille du vol">'+
             esc(state.sheetRev + (cs ? ' · '+cs : ''))+'</span>');
    /* 34 cases vides ne disent pas si le document n'en porte pas ou si la
       lecture a echoue : on leve l'ambiguite sans crier. Uniquement quand aucun
       cartouche n'est reconnu — anomalie et cellules vides ont leur propre
       traitement. */
    if(state.sheet && !cartouche){
      out.push('<span class="rev-note" title="Aucun des cinq cartouches du §A.4 n\'a été reconnu dans cette feuille">'+
               'feuille sans cartouche</span>');
    }else if(state.sheet && cartouche && cartouche.resolues < cartouche.total){
      out.push('<span class="rev-note" title="Cellules des cinq cartouches résolues à la lecture">'+
               cartouche.resolues+'/'+cartouche.total+' cellules</span>');
    }
  }
  if(!out.length) out.push('<span class="rev-chip vide">aucun briefing</span>');
  return out.join('');
}
function paintBadge(){ el.revTag.innerHTML = badgeRev(); }
function idxDoc(){   if(!docIdx   && state.doc)   docIdx   = buildIndex(state.doc);   return docIdx; }
function idxSheet(){ if(!sheetIdx && state.sheet) sheetIdx = buildIndex(state.sheet); return sheetIdx; }

/* "2" ne doit pas attraper "2.1" : apres le numero, un separateur est exige */
function findHead(idx, ref){
  if(!idx) return -1;
  return idx.heads.findIndex(h=>
    h.txt === ref || (h.txt.slice(0,ref.length) === ref && /^[\s·:\-–—]/.test(h.txt.slice(ref.length)))
  );
}
function countRefs(idx){
  let n = 0;
  ALL_REFS.forEach(r=>{ if(findHead(idx, r) >= 0) n++; });
  return n;
}

/* ------------------------------------------------------------
   DOSSIER OU FEUILLE
   Compter les renvois § ne suffit plus. Depuis la REV 19, une feuille reprend
   les titres §0.1 a §0.11 du dossier : elle en resout douze, passait donc pour
   un dossier, et AUCUNE de ses valeurs n'etait extraite — la page se chargeait
   sans rien remplir, en silence.
   Ce qui separe reellement les deux, c'est que la feuille PORTE des valeurs :
   les cartouches du dossier sont des gabarits, cellule vide ou methode en
   prose, et rien n'y passe la validation. On compte donc les cellules du
   cartouche reellement resolues.
   readValues() ne touche a aucun global : la mesure est sans effet de bord.
------------------------------------------------------------ */
const CELLULES_FEUILLE = 8;
function compteCellules(txt){
  const vals = readValues(txt.split('\n')).vals;
  let n = 0;
  REQUIRED.forEach(e=>{ if(vals[e.key] !== undefined) n++; });
  return n;
}

function applyDoc(txt){
  const idx = buildIndex(txt);
  const cells = compteCellules(txt);
  const dossier = cells < CELLULES_FEUILLE && countRefs(idx) >= 10;
  const m = txt.match(/REV\s*(\d+)/i);
  const rev = m ? ('REV '+m[1]) : 'BRIEFING';
  if(dossier){ state.doc = txt;   state.rev = rev;      docIdx = idx;   docDirty = true; }
  else       { state.sheet = txt; state.sheetRev = rev; sheetIdx = idx; sheetDirty = true; }
  /* seule la feuille du vol alimente les cases : le gabarit du dossier remplirait
     "Compagnie" avec "OACI 3 lettres" */
  let vals = 0;
  if(!dossier){
    const got = extractValues(txt);        /* renseigne aussi le cartouche lu */
    state.sheetCallsign = got.callsign || '';
    vals = fillFrom(got);
    paintAlert();
  }
  paintBadge();
  markRefs();
  save();
  return { refs:availableRefs().length, vals:vals, dossier:dossier, rev:rev,
           anomalies: cartouche ? (cartouche.bad.length + cartouche.unknown.length + cartouche.missing.length) : 0 };
}

/* le chargement doit se voir : nature du fichier, valeurs reprises, couverture */
function announceDoc(r){
  const tot = ALL_REFS.length;
  const b = r.refs === tot ? 'les '+tot+' renvois § sont lisibles'
                           : r.refs+' renvoi'+(r.refs>1?'s':'')+' § sur '+tot;
  if(r.dossier){ toast(r.rev+' · dossier chargé — '+b); return; }
  const a = r.vals ? r.vals+' valeur'+(r.vals>1?'s':'')+' reprise'+(r.vals>1?'s':'')
                   : 'aucune valeur reconnue';
  /* l'anomalie de cartouche passe devant le reste : elle se corrige avant de voler */
  if(r.anomalies){ toast(r.rev+' · feuille du vol — '+a+' · cartouche à vérifier'); return; }
  toast(r.rev+' · feuille du vol — '+a+' · '+b);
}

async function readFile(f){
  if(!f) return false;
  if(!/\.(md|markdown|txt)$/i.test(f.name)){
    toast('Fichier ignoré : .md, .markdown ou .txt attendu'); return false;
  }
  try{
    announceDoc(applyDoc(await f.text()));
    return true;
  }catch(e){
    toast('Lecture du fichier impossible'); return false;
  }
}

el.btnLoad.addEventListener('click', ()=> el.file.click());
el.file.addEventListener('change', async e=>{
  await readFile(e.target.files[0]);
  e.target.value = '';                        /* le meme fichier peut etre recharge */
});

/* on n'intercepte que les fichiers : le glisser-deposer de texte dans un champ reste possible */
const hasFiles = e => !!(e.dataTransfer && Array.from(e.dataTransfer.types||[]).indexOf('Files') >= 0);
document.addEventListener('dragover', e=>{ if(hasFiles(e)) e.preventDefault(); });
document.addEventListener('drop', async e=>{
  if(!hasFiles(e)) return;
  e.preventDefault();
  await readFile(e.dataTransfer.files[0]);
});

/* Libelles vus mais volontairement ignores : ils ne remontent ni en valeur,
   ni en "libellé non reconnu". Trois familles :
   — en-tetes et intitules de colonnes qui trainent en premiere cellule ;
   — les « repères non lus » du §A.4, en attente d'inscription au registre :
     immatriculation, altitude initiale, autobrake, route, date, MANQUE.
     Ils restent DEHORS du registre tant que la REV les y laisse : la regle 11
     interdit qu'un libelle declare figure dans un bloc annonce comme non lu ;
   — les champs du formulaire qui n'ont pas de case et dont le libelle
     pourrait se resoudre par accident. */
const IGNORE = ['poste','champ','marqueur','config','annonce','repere','libelle',
                'itineraire','immatriculation','altitude initiale',
                'autobrake','autobrake depart','autobrake arrivee',
                'route','date','manque','piste','runway','compte alternatif',
                /* §A.5 : Compagnie porte le code OACI, « jamais le nom
                   commercial » — le libelle existe donc dans les vieilles
                   feuilles, mais il n'alimente rien. */
                'nom commercial'];

/* ------------------------------------------------------------
   IGNORE CONTEXTUEL — REV 19, correctif bloquant
   « Altitude (Pieds) » est porte DEUX fois par le formulaire : le FL de
   croisiere aux Entrees facultatives, et l'elevation du terrain de degagement
   aux Aeroports alternatifs. Le libelle est identique au caractere pres, donc
   seule la SECTION peut les separer. Sans ca, « la derniere l'emporte » faisait
   remonter l'elevation du degagement a la place du niveau de croisiere, en
   silence — exactement le cas que la REV 19 signale.
------------------------------------------------------------ */
/* « degagement n° 1 » et non le mot degagement seul : un cartouche qui parle de
   degagement ne doit pas, pour autant, perdre ses autres lignes. */
const SECTION_ALTERNATE = /alternatif|alternate|degagement n/;
const IGNORE_EN_SECTION = [
  { labels:['altitude','altitude (pieds)','altitude (feet)'], section:SECTION_ALTERNATE }
];

/* index libelle -> entree. Une collision est une faute de declaration : on
   refuse de demarrer plutot que de resoudre au hasard. */
const REG_BY_LABEL = new Map();
REGISTRE.forEach(e=>{
  e.labels.forEach(l=>{
    if(REG_BY_LABEL.has(l))
      throw new Error('REGISTRE : libellé en double « '+l+' » — '+REG_BY_LABEL.get(l).key+' contre '+e.key);
    REG_BY_LABEL.set(l, e);
  });
});
const REQUIRED = REGISTRE.filter(e=>e.required);

/* controle de demarrage : une cle du registre absente de FIELDS ne remplirait
   jamais rien, en silence. C'est exactement l'oubli qui a coute BINGO et MIN DIV. */
(function(){
  const connues = FIELDS.map(f=>f[0]);
  REGISTRE.forEach(e=>{
    if(e.key.charAt(0) === '_') return;                 /* cles internes */
    if(connues.indexOf(e.key) < 0)
      console.error('REGISTRE : la clé « '+e.key+' » n\'existe pas dans FIELDS — ce champ ne sera jamais rempli.');
  });
})();

function normLabel(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
          .replace(/[`*]/g,'').replace(/\s+/g,' ').trim();
}
function cleanCell(s){
  return s.replace(/[`*]/g,'').replace(/\[(SIM|FORM|NAV|CALC)\]/g,'')
          .replace(/\s+/g,' ').trim();
}
function digits(s){ return s.replace(/[\s\u00A0\u202F]/g,''); }

/* Un libelle s'ecrit "Compagnie aérienne (Airline)" : on essaie la chaine
   entiere, puis chaque moitie — trois egalites strictes, jamais un "contient". */
function regFor(raw){
  const n = normLabel(raw);
  if(REG_BY_LABEL.has(n)) return REG_BY_LABEL.get(n);
  const m = n.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  if(m){
    if(REG_BY_LABEL.has(m[1])) return REG_BY_LABEL.get(m[1]);
    if(REG_BY_LABEL.has(m[2])) return REG_BY_LABEL.get(m[2]);
  }
  return null;
}
/* section : titre de la section qui contient la ligne, deja normalise.
   Un libelle peut n'etre ignore QUE la ou il change de sens (§A.5). */
function estIgnore(raw, section){
  const n = normLabel(raw);
  const formes = [n];
  const m = n.match(/^(.*?)\s*\(([^)]*)\)\s*$/);
  if(m){ formes.push(m[1], m[2]); }
  if(formes.some(f => IGNORE.indexOf(f) >= 0)) return true;
  if(section){
    return IGNORE_EN_SECTION.some(r =>
      r.section.test(section) && formes.some(f => r.labels.indexOf(f) >= 0));
  }
  return false;
}

/* ------------------------------------------------------------
   3 · VALIDATE — remplace refine(), pickValue() disparait
   Regle non negociable : aucun /^\d+/ ni /[^\d]/g sur une cellule.
   Ce racle-tout a produit LW = 6446077.8 en collant trois nombres
   d'une meme cellule. Une cellule qui contient autre chose qu'une
   valeur est un rejet, pas une matiere premiere.
------------------------------------------------------------ */
const UNITE = /(kg|ft|kt|nm|min|°c|°)$/i;
/* MANQUE est le marqueur de non-fourni du dossier (§Conventions), pas une
   valeur : sans cette ligne il passait pour un code valide et « MANQUE »
   s'affichait dans la case ILS comme s'il s'agissait d'une frequence. */
const VIDE  = /^(auto|n\/a|na|none|laisser vide|vide|manque|—|-)$/i;

function validate(e, raw){
  const v = (raw || '').trim();
  if(!v || VIDE.test(v)) return { ok:false, reason:'non fourni' };
  const max = e.max || 60;
  if(v.length > max) return { ok:false, reason:'trop long ('+v.length+' car., max '+max+')' };

  if(e.kind === 'int' || e.kind === 'dec'){
    const s = digits(v).replace(UNITE, '');
    const motif = e.kind === 'int' ? /^\d+$/ : /^\d+([.,]\d+)?$/;
    if(!motif.test(s)) return { ok:false, reason:'cellule non atomique : « '+v+' »' };
    let n = parseFloat(s.replace(',', '.'));
    if(!isFinite(n)) return { ok:false, reason:'nombre illisible : « '+v+' »' };
    if(e.kind === 'dec' && n > 1000) n = Math.round(n/100)/10;      /* kg -> t */
    if(e.xf) n = e.xf(n);
    return { ok:true, value:String(n) };
  }
  if(e.kind === 'code'){
    if(!/^[A-Z0-9+.\-\/]{1,12}$/i.test(v))
      return { ok:false, reason:'code attendu, reçu « '+v+' »' };
    return { ok:true, value:v };
  }
  return { ok:true, value:v };                                      /* text */
}

/* ------------------------------------------------------------
   2 · LECTURE DES TABLEAUX
   Une valeur ne vient QUE d'une ligne de tableau dont la forme est
   declaree. Prose, titre, liste, tableau d'une autre forme : ignores.
------------------------------------------------------------ */
const SEPARATEUR = /^\s*\|[\s\-:|]+$/;
function cellsOf(l){ return l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim()); }

/* Chaque tableau retient le titre de section qui le precede — titre markdown,
   ou ligne en gras isolee du genre "**Dégagement n° 1**", qui est la seule
   chose qui separe le bloc du degagement du reste des Aeroports alternatifs.
   Sans ce contexte, "Altitude (Pieds)" ne peut pas etre departage (§A.5). */
function tables(lines){
  const out = [];
  let inCode = false, section = '';
  for(let i = 0; i < lines.length; i++){
    if(/^```/.test(lines[i])){ inCode = !inCode; continue; }
    if(inCode) continue;
    const h = lines[i].match(/^#{1,6}\s+(.*)$/);
    if(h){ section = normLabel(h[1].replace(/^§\s*/,'')); continue; }
    const g = lines[i].match(/^\s*\*\*(.+?)\*\*\s*:?\s*$/);
    if(g){ section += ' ' + normLabel(g[1]); continue; }
    if(!/^\s*\|/.test(lines[i])) continue;
    if(!SEPARATEUR.test(lines[i+1] || '')) continue;
    let end = i + 2;
    while(end < lines.length && /^\s*\|/.test(lines[end]) && !SEPARATEUR.test(lines[end])) end++;
    out.push({ headCells:cellsOf(lines[i]), from:i + 2, to:end, section:section });
    i = end - 1;
  }
  return out;
}

/* quelle colonne porte la valeur, ou null si la forme n'est pas reconnue */
function valueColumn(headCells){
  if(headCells.length === 2) return 1;
  if(headCells.length === 3 && normLabel(headCells[1]).indexOf('a taper') >= 0) return 1;
  return null;
}

function readValues(lines){
  const rows = [], found = [], tabs = tables(lines);
  tabs.forEach(t=>{
    const col = valueColumn(t.headCells);
    for(let i = t.from; i < t.to; i++){
      const cells = cellsOf(lines[i]);
      const label = cells[0] || '';
      if(col === null){
        rows.push({ line:i+1, label:label, ok:false, shape:true,
                    reason:'tableau ignoré ('+t.headCells.length+' colonnes)' });
        continue;
      }
      /* Un libelle explicitement ignore l'emporte sur toute resolution. Sans cela,
         "Itinéraire (Route)" du tableau de degagement se resout en 'route' par sa
         moitie anglaise et, avec la regle "la derniere gagne", ecrase le vrai
         LFML → EDDM par un DCT. Meme mecanique pour "Altitude (Pieds)", qui vaut
         FL de croisiere aux Entrees facultatives et elevation de terrain chez les
         Aeroports alternatifs — d'ou l'ignore contextuel (REV 19). */
      if(estIgnore(label, t.section)){
        rows.push({ line:i+1, label:label, ok:false, reason:'ignoré volontairement' });
        continue;
      }
      const e = regFor(label);
      if(!e){
        rows.push({ line:i+1, label:label, ok:false, unknown:true, reason:'libellé non reconnu' });
        continue;
      }
      const raw = cleanCell(cells[col] || '');
      const r = validate(e, raw);
      rows.push({ line:i+1, label:label, key:e.key, raw:raw, value:r.value, ok:r.ok, reason:r.reason });
      if(r.ok) found.push({ key:e.key, value:r.value, line:i+1 });
    }
  });
  /* Meme cle plusieurs fois : la derniere ligne gagne. Mais un doublon
     identique est une redondance assumee entre le formulaire et le cartouche,
     pas un defaut — seul un doublon DIVERGENT merite un avertissement. */
  const vals = {}, vue = {};
  found.forEach(f=>{
    const p = vue[f.key];
    if(p){
      if(p.value === f.value)
        console.info('Briefing : « '+f.key+' » répété lignes '+p.line+' et '+f.line+
                     ' — même valeur ('+f.value+'), redondance assumée');
      else
        console.warn('Briefing : « '+f.key+' » diverge — ligne '+p.line+' donne « '+p.value+
                     ' », ligne '+f.line+' donne « '+f.value+' » — la dernière gagne');
    }
    vue[f.key] = { line:f.line, value:f.value };
    vals[f.key] = f.value;
  });
  return { vals:vals, rows:rows, tabs:tabs };
}

/* ------------------------------------------------------------
   4 · CARTOUCHES — completude des 34 cellules (REV 19 §A.4)
   La REV 18 n'avait qu'un cartouche, donc un seul tableau : on validait
   "le premier tableau de la section Cartouche". La REV 19 en a CINQ — ①
   identite, ② pistes, ③ vitesses, ④ carburant, ⑤ masses — et une feuille
   les titre comme elle veut. Chercher un tableau nomme ne tient plus.
   Desormais la completude se mesure sur TOUT le document : une cellule
   requise est resolue, refusee, ou absente, ou qu'elle soit ecrite.
------------------------------------------------------------ */
/* Un tableau est "zone de cartouche" s'il est a DEUX colonnes — le §A.4 impose
   `Champ | Valeur` — et s'il porte au moins deux libelles requis. Les deux
   conditions comptent : les tableaux du §0 sont a trois colonnes et portent
   eux aussi des libelles requis (Type et Indicatif d'appel dans Informations
   sur l'avion), mais leurs autres lignes — Variante, les trois Profils — sont
   des reglages sans libelle au registre. Les compter en "non reconnus" levait
   un bandeau d'anomalie sur une feuille pourtant conforme. */
function zonesCartouche(lines, read){
  return read.tabs.filter(t=>{
    if(t.headCells.length !== 2) return false;
    let n = 0;
    for(let i = t.from; i < t.to; i++){
      const label = cellsOf(lines[i])[0] || '';
      if(estIgnore(label, t.section)) continue;
      const e = regFor(label);
      if(e && e.required) n++;
    }
    return n >= 2;
  });
}

function readCartouche(lines, read){
  const zones = zonesCartouche(lines, read);
  const dansZone = i => zones.some(z => i >= z.from && i < z.to);

  const bad = [], unknown = [], rejected = [], unresolved = [], vus = {}, refuse = {};
  read.rows.forEach(r=>{
    const nom = cleanCell(r.label) || ('ligne '+r.line);
    /* forme du tableau et libelles inconnus : seulement dans les cartouches,
       sinon le §0 entier remonterait au bandeau a chaque chargement */
    if(r.shape){ if(dansZone(r.line-1)) bad.push(nom); return; }
    if(r.unknown){ if(dansZone(r.line-1)) unknown.push(nom); return; }
    if(!r.key) return;                                   /* ignore volontairement */
    if(r.ok){ vus[r.key] = 1; return; }
    /* AUTO ou cellule vide n'est pas un refus : la ligne n'a rien tenté.
       Une cellule ecrite mais illisible, si — et elle se nomme une seule fois. */
    if(r.reason === 'non fourni') return;
    const e = REG_BY_LABEL.get(normLabel(r.label)) || regFor(r.label);
    if(!(e && e.required)) return;                       /* hors 34 : voir refus */
    if(refuse[r.key]) return;
    refuse[r.key] = 1;
    rejected.push(nom+' — '+r.reason);
  });

  const manques = REQUIRED.filter(e=>!vus[e.key] && !refuse[e.key]);
  manques.forEach(e=> unresolved.push(e.key));
  Object.keys(refuse).forEach(k=> unresolved.push(k));

  /* aucun cartouche reconnu ET aucune des 34 lue : le fichier n'en porte pas */
  if(!zones.length && !Object.keys(vus).length) return null;

  return { bad:bad, unknown:unknown, rejected:rejected, missing:manques.map(e=>e.display),
           zones:zones, unresolved:unresolved, total:REQUIRED.length,
           resolues:REQUIRED.filter(e=>vus[e.key]).length };
}

/* ------------------------------------------------------------
   6 · PROSE — reduite au strict residuel
   MIN DIV, BINGO, bloc et LW en sont sortis : ils viennent desormais
   de tableaux declares. Leurs regex etaient gourmandes ([^\n]*), donc
   elles remontaient jusqu'a la DERNIERE clause "= N kg" de la ligne —
   "réserve finale = 1 100 kg" — au lieu de leur propre valeur.
   Ne restent que des motifs ancres, sans quantificateur ouvert.
   N'ecrit jamais par-dessus une cle deja lue en tableau.
------------------------------------------------------------ */
function scanProse(txt, out){
  let m;
  /* "258° / 42 NM depuis LEBL" — cap et distance du degagement */
  m = txt.match(/(\d{1,3})\s*°\s*\/\s*(\d{1,4})\s*NM/);
  if(m){ if(!out.degcap) out.degcap = m[1]; if(!out.degdist) out.degdist = m[2]; }
  /* pistes attendues, telles qu'elles figurent dans les remarks de l'OFP */
  m = txt.match(/DEP\s*RWY\s*EXPECTED\s*(\d{2}[LRC]?)/i);
  if(m && !out.piste) out.piste = m[1];
  m = txt.match(/ARR\s*RWY\s*EXPECTED\s*(\d{2}[LRC]?)/i);
  if(m && !out.arrpiste) out.arrpiste = m[1];
}

let cartouche = null;      /* dernier relevé de completude, pour le bandeau */
let trace = null;          /* dernier relevé de lecture, pour le mode debug */
let refus = [];            /* valeurs refusées hors des 34 du cartouche */

function extractValues(txt){
  const lines = txt.split('\n');
  const read = readValues(lines);
  const out = Object.assign({}, read.vals);
  /* Partir → Arriver se reconstruit toujours depuis les deux lignes atomiques :
     aucun libellé « Route » n'est lu, le mot est trop ambigu (voir REGISTRE) */
  if(out._dep && out._arr) out.route = out._dep+' → '+out._arr;
  scanProse(txt, out);                                   /* cles encore absentes uniquement */
  cartouche = readCartouche(lines, read);
  /* Un rejet disparaissait en silence : la case restait vide sans rien dire,
     exactement le defaut que la lecture stricte doit supprimer. Une cellule
     VIDE ou en AUTO n'est pas un rejet — elle n'a rien tenté ; une cellule
     refusee, si. Les 34 sont deja rapportees par readCartouche : ne restent
     ici que les champs de formulaire, pour ne rien compter deux fois. */
  refus = read.rows.filter(r=>{
    if(!(r.key && !r.ok && r.reason !== 'non fourni')) return false;
    if(out[r.key] !== undefined) return false;
    return !(regFor(r.label) || {}).required;
  }).map(r=>({ key:r.key, label:cleanCell(r.label) || ('ligne '+r.line), line:r.line, reason:r.reason }));
  trace = read.rows;
  return out;
}

/* ------------------------------------------------------------
   5 · MODE DEBUG — window.debugBriefing()
   Pour chaque champ : libelle cherche, ligne retenue, cellule brute,
   valeur apres normalisation. Et les rejets, avec leur motif.
------------------------------------------------------------ */
function debugBriefing(){
  if(!trace){ console.log('Aucun briefing lu dans cette session.'); return; }
  const ok = trace.filter(r=>r.ok).map(r=>({
    champ:r.key, libellé:r.label, ligne:r.line, brut:r.raw, valeur:r.value }));
  const ko = trace.filter(r=>!r.ok && (r.key || r.unknown)).map(r=>({
    champ:r.key || '—', libellé:r.label, ligne:r.line, brut:r.raw || '', motif:r.reason }));
  console.log('%c'+ok.length+' valeur(s) retenue(s)', 'font-weight:bold');
  console.table(ok);
  console.log('%c'+ko.length+' ligne(s) écartée(s)', 'font-weight:bold');
  console.table(ko);
  return { retenues:ok, ecartees:ko };
}
window.debugBriefing = debugBriefing;

/* bandeau d'anomalie : une case vide et signalee vaut mieux qu'une valeur fausse */
function paintAlert(){
  const c = cartouche, parts = [];
  const pluriel = (n,s,p)=> n > 1 ? p : s;
  if(c){
    if(c.bad.length) parts.push(
      c.bad.length+' '+pluriel(c.bad.length,'ligne ignorée','lignes ignorées')+
      ' (format de tableau non reconnu) : '+c.bad.join(', '));
    if(c.unknown.length) parts.push(
      pluriel(c.unknown.length,'libellé non reconnu','libellés non reconnus')+' : '+c.unknown.join(', '));
    if(c.rejected.length) parts.push(
      pluriel(c.rejected.length,'valeur refusée','valeurs refusées')+' : '+c.rejected.join(' · '));
    if(c.missing.length) parts.push(
      pluriel(c.missing.length,'champ absent','champs absents')+' : '+c.missing.join(', '));
  }
  const horsCart = refus.map(r=> r.label+' (ligne '+r.line+') — '+r.reason);
  /* Une cellule simplement absente n'est pas un cartouche mal forme : le
     dossier admet le marqueur MANQUE, motive en prose. Ne crier au defaut de
     format que quand la forme est reellement en cause. */
  const malForme = !!(c && (c.bad.length || c.unknown.length || c.rejected.length));
  const titre = malForme ? 'Cartouche mal formé.'
              : (c && c.missing.length) ? 'Cartouche incomplet — '+c.resolues+'/'+c.total+' cellules.'
              : 'Valeur refusée à la lecture.';
  if(horsCart.length) parts.push(
    pluriel(horsCart.length,'hors cartouche','hors cartouche')+' : '+horsCart.join(' · '));
  if(!parts.length){ el.alert.hidden = true; el.alert.textContent = ''; return; }
  el.alert.innerHTML =
    '<strong>'+esc(titre)+'</strong> '+esc(parts.join(' · '))+
    '<span class="alert-note">Ces cases restent vides et non remplies : sur une feuille de vol, '+
    'une valeur fausse silencieuse est le pire cas.</span>';
  el.alert.hidden = false;
}

/* Au demarrage, la feuille restauree du stockage est RELUE, pas seulement
   revalidee : les valeurs sont re-derivees du document et reappliquees.
   Sans cela, une feuille chargee par une version anterieure du lecteur garde
   pour toujours les cases que cette version-la savait remplir — BLOC, BINGO,
   MIN DIV et LW sont restes vides plusieurs rechargements durant, sans qu'un
   rafraichissement puisse y changer quoi que ce soit. Le document est la
   source, le stockage n'en est qu'un cache.
   Les saisies manuelles restent protegees : fillFrom ne touche que l'auto. */
function validateSheet(){
  if(state.sheet){
    const got = extractValues(state.sheet);     /* renseigne cartouche, refus et trace */
    fillFrom(got);
    save();
  }else{
    cartouche = null; refus = []; trace = null;
  }
  paintAlert();
  paintBadge();
  paintUnresolved();
}

/* champ attendu mais non resolu : etat visuel distinct d'une case simplement vide */
function paintUnresolved(){
  const ko = ((cartouche && cartouche.unresolved) ? cartouche.unresolved : [])
             .concat(refus.map(r=>r.key));
  FIELDS.forEach(([k])=>{
    const inp = document.getElementById('f-'+k);
    if(!inp) return;
    const nr = ko.indexOf(k) >= 0 && !(state.values[k]||'').trim();
    inp.parentElement.classList.toggle('unresolved', nr);
    if(nr) inp.title = 'Attendu au cartouche, non résolu à la lecture — voir le bandeau';
    else if(!state.auto[k]) inp.removeAttribute('title');
  });
}

/* ------------------------------------------------------------
   5 · REMPLISSAGE
   L'ancienne regle "ne pas ecraser une case non vide" protegeait aussi
   les reprises d'un briefing precedent : un 1100 faux survivait a tous
   les rechargements, y compris a la feuille corrigee. Desormais :
     saisie du pilote (non vide ET pas marquee auto) -> intouchable
     reprise d'un briefing                            -> ecrasee
     reprise devenue absente ou refusee               -> EFFACEE
------------------------------------------------------------ */
function fillFrom(got){
  let n = 0;
  FIELDS.forEach(([k])=>{
    const inp   = document.getElementById('f-'+k);
    const neuf  = (got && got[k] != null) ? String(got[k]) : '';
    const saisi = (state.values[k]||'').trim() && !state.auto[k];
    if(saisi) return;                                   /* saisie du pilote : intouchable */

    if(neuf){
      state.values[k] = neuf;
      state.auto[k] = 1;
      if(inp){
        inp.value = neuf;
        inp.parentElement.classList.add('auto');
        inp.parentElement.classList.remove('unresolved');
        inp.title = 'Valeur reprise du briefing — à confirmer sur l\'OFP';
      }
      n++;
    }else if(state.auto[k]){                            /* reprise qui n'a plus de source */
      delete state.values[k];
      delete state.auto[k];
      if(inp){
        inp.value = '';
        inp.parentElement.classList.remove('auto');
        inp.removeAttribute('title');
      }
    }
  });
  refreshValues();
  paintUnresolved();
  return n;
}

/* tous les renvois cites par la checklist, sans doublon */
const ALL_REFS = Array.from(new Set(
  PHASES.reduce((a,p)=> a.concat(p.items.map(it=>it.r).filter(Boolean)), [])
));

/* un renvoi est lisible s'il figure dans l'un des deux documents charges */
function hasRef(ref){
  return findHead(idxDoc(), ref) >= 0 || findHead(idxSheet(), ref) >= 0;
}
function availableRefs(){
  const ok = [];
  ALL_REFS.forEach(r=>{ if(hasRef(r)) ok.push(r); });
  return ok;
}
function loaded(){ return !!(state.doc || state.sheet); }

/* chaque pastille § annonce si sa section figure dans ce qui est charge :
   c'est le retour visible qui manquait au chargement */
function markRefs(){
  const ok = availableRefs();
  el.phases.querySelectorAll('.ref').forEach(b=>{
    if(!loaded()){ b.classList.remove('ok','miss'); b.removeAttribute('title'); return; }
    const has = ok.indexOf(b.dataset.ref) >= 0;
    b.classList.toggle('ok', has);
    b.classList.toggle('miss', !has);
    b.title = has ? 'Section présente dans les documents chargés'
                  : 'Absente des documents chargés';
  });
}

/* extrait une section du markdown a partir de son numero (0, 2.3, 6.6, A.4).
   La feuille du vol passe avant le dossier : quand les deux portent la meme
   section (§0, §A.4), c'est celle du vol du jour qui sert, chiffres compris. */
function section(ref){
  const sources = [idxSheet(), idxDoc()];
  for(let s = 0; s < sources.length; s++){
    const idx = sources[s];
    const start = findHead(idx, ref);
    if(start < 0) continue;
    const h = idx.heads[start];
    let end = idx.lines.length;
    for(let k = start+1; k < idx.heads.length; k++){
      if(idx.heads[k].lvl <= h.lvl){ end = idx.heads[k].i; break; }
    }
    return { title:h.txt, body:idx.lines.slice(h.i+1, end).join('\n').trim() };
  }
  return null;
}

/* rendu markdown minimal, suffisant pour ce dossier */
function md2html(src){
  const out = [], lines = src.split('\n');
  let i = 0, inCode = false, code = [];
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/⚠/g,'<span class="w">⚠</span>');
  const BLOCK = /^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|\s*\||```)/;

  while(i < lines.length){
    const l = lines[i];
    if(/^```/.test(l)){
      if(inCode){ out.push('<pre>'+esc(code.join('\n'))+'</pre>'); code = []; inCode = false; }
      else inCode = true;
      i++; continue;
    }
    if(inCode){ code.push(l); i++; continue; }

    if(/^\s*\|/.test(l) && /^\s*\|/.test(lines[i+1]||'') && /-{2,}/.test(lines[i+1]||'')){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(l); i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }

    const hm = l.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ out.push('<h3>'+inline(hm[2])+'</h3>'); i++; continue; }

    if(/^\s*[-*]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*[-*]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*]\s+/,'')); i++; }
      out.push('<ul>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ul>');
      continue;
    }
    if(/^\s*\d+[.)]\s+/.test(l)){
      const items = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; }
      out.push('<ol>'+items.map(t=>'<li>'+inline(t)+'</li>').join('')+'</ol>');
      continue;
    }

    if(/^\s*---+\s*$/.test(l)){ i++; continue; }
    if(l.trim() === ''){ i++; continue; }

    const para = [];
    while(i < lines.length && lines[i].trim() !== '' && !BLOCK.test(lines[i])){ para.push(lines[i]); i++; }
    out.push('<p>'+inline(para.join(' '))+'</p>');
  }
  if(inCode && code.length) out.push('<pre>'+esc(code.join('\n'))+'</pre>');
  return out.join('');
}

let lastFocus = null;
function openRef(ref){
  if(!loaded()){
    el.drTitle.textContent = '§'+ref;
    el.drBody.innerHTML = '<div class="empty-state">Le briefing n\'est pas chargé. Touchez « Charger le briefing » en haut et choisissez le fichier .md du dossier : le texte exact de chaque renvoi s\'ouvrira ici.</div>';
  }else{
    const s = section(ref);
    if(!s){
      el.drTitle.textContent = '§'+ref;
      const ok = availableRefs();
      const liste = ok.length ? ok.map(r=>'§'+r).join(' · ') : 'aucun';
      const chargés = [state.rev ? 'dossier '+state.rev : null,
                       state.sheetRev ? 'feuille '+state.sheetRev : null].filter(Boolean).join(' + ');
      el.drBody.innerHTML =
        '<div class="empty-state">'+
        '<p>La section <strong>§'+esc(ref)+'</strong> ne figure pas dans ce qui est chargé ('+esc(chargés)+').</p>'+
        '<p>Renvois réellement disponibles : '+esc(liste)+' — soit <strong>'+ok.length+' sur '+ALL_REFS.length+'</strong>.</p>'+
        '<p>Il manque le dossier complet, ou la section porte un autre titre.</p>'+
        '</div>';
    }else{
      el.drTitle.textContent = s.title;
      el.drBody.innerHTML = md2html(s.body);
    }
  }
  lastFocus = document.activeElement;
  el.drawer.classList.add('open');
  el.drawer.removeAttribute('aria-hidden');
  document.body.style.overflow = 'hidden';
  el.drBody.parentElement.scrollTop = 0;
  el.drClose.focus({preventScroll:true});
}

function closeRef(){
  if(!el.drawer.classList.contains('open')) return;
  el.drawer.classList.remove('open');
  el.drawer.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
  lastFocus = null;
}

el.drClose.addEventListener('click', closeRef);
el.drawer.addEventListener('click', e=>{ if(e.target === el.drawer) closeRef(); });
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeRef(); });

/* le clavier reste dans le lecteur tant qu'il est ouvert */
el.drawer.addEventListener('keydown', e=>{
  if(e.key !== 'Tab') return;
  const f = Array.prototype.filter.call(
    el.drawer.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])'),
    x => x.offsetParent !== null
  );
  if(!f.length) return;
  const first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
});

/* ============================================================
   OUTILS
============================================================ */
function syncOpenBtn(){
  el.btnOpen.textContent = allOpen ? 'Tout replier' : 'Tout déplier';
  el.btnOpen.classList.toggle('on', allOpen);
  el.btnOpen.setAttribute('aria-pressed', allOpen ? 'true':'false');
}
el.btnOpen.addEventListener('click', ()=>{
  allOpen = !allOpen;
  syncOpenBtn();
  applyOpen();
});

el.btnReset.addEventListener('click', ()=>{
  if(!confirm('Nouveau vol : toutes les cases se décochent et les valeurs du vol s\'effacent. Le briefing chargé reste.')) return;
  state.done = {}; state.values = {}; state.auto = {}; state.open = 0;
  FIELDS.forEach(([k])=>{
    const i = document.getElementById('f-'+k);
    if(i){ i.value = ''; i.removeAttribute('title'); i.parentElement.classList.remove('auto'); }
  });
  render();
  save();
  window.scrollTo({top:0, behavior:'smooth'});
  toast('Checklist remise à zéro');
});

let toastTimer = null;
function toast(msg){
  el.toastEl.textContent = msg;
  el.toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.toastEl.classList.remove('show'), 2600);
}

/* ============================================================
   DEMARRAGE
============================================================ */
/* le briefing publie a cote de la page se charge seul, sans rien toucher */
async function tryFetch(nom){
  try{
    const r = await fetch(nom, {cache:'no-store'});
    if(!r.ok) return null;
    const txt = await r.text();
    return /BRIEFING/i.test(txt) ? txt : null;
  }catch(e){ return null; }   /* page ouverte hors serveur : le bouton reste la */
}
async function autoLoad(){
  /* Noms canoniques, sans numero de revision : la revision se lit DANS le
     document (le badge l'affiche), pas dans le nom du fichier. Un seul nom
     stable evite de sonder une dizaine de variantes a chaque ouverture. */
  if(!state.doc){
    const t = await tryFetch('./briefing.md');
    if(t) announceDoc(applyDoc(t));
  }
  if(!state.sheet){
    const t = await tryFetch('./feuille.md');
    if(t) announceDoc(applyDoc(t));
  }
}

(async function(){
  await load();
  paintBadge();
  buildNodes();
  buildValues();
  syncOpenBtn();
  render();
  validateSheet();          /* la feuille restaurée du stockage se revalide */
  await autoLoad();
})();
</script>
